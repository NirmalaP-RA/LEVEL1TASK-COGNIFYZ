<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form(Local Storage using table)</title>
    <link type="text/css" rel="stylesheet" href="css/style.css" />
</head>
<style>
   
    .form-group input:focus,
    .form-group select:focus {
        border-color: #007bff;
        outline: none;
    }

    .submit-btn:hover {
        background-color: #0056b3;
    }

</style>

<body style="font-family: Arial, sans-serif;
            background-color: #f7f7f7;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            margin: 0;">
    <div class="form-container" style="background-color: #fff;
                                        padding: 20px;
                                        border-radius: 8px;
                                        box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
                                        max-width: 400px;
                                        width: 100%;
                                        margin-top: 30px;
                                        margin-bottom: 20px;">
        <h2 style=" text-align: center;margin-bottom: 20px;">Basic Form</h2>
        <form id="formHandler" autocomplete="off" >
            <div class="form-group" style=" margin-bottom: 15px;">
                <label for="name" style=" display: block; margin-bottom: 5px;">Name</label>
                <input type="text" id="name" name="name" required style=" width: 100%;
                                                                            padding: 10px;
                                                                            border: 1px solid #ccc;
                                                                            border-radius: 4px;
                                                                            box-sizing: border-box;">
            </div>
            <div class="form-group" style=" margin-bottom: 15px;">
                <label for="email" style=" display: block; margin-bottom: 5px;">Email</label>
                <input type="email" id="email" name="email" required style=" width: 100%;
                                                                                padding: 10px;
                                                                                border: 1px solid #ccc;
                                                                                border-radius: 4px;
                                                                                box-sizing: border-box;">
            </div>
            <div class="form-group" style=" margin-bottom: 15px;">
                <label for="mobile" style=" display: block;margin-bottom: 5px;">Mobile Number</label>
                <input type="tel" id="mobile" name="mobile" required style=" width: 100%;
                                                                                    padding: 10px;
                                                                                    border: 1px solid #ccc;
                                                                                    border-radius: 4px;
                                                                                    box-sizing: border-box;">
            </div>
            <div class="form-group" style=" margin-bottom: 15px;">
                <label for="country" style=" display: block;margin-bottom: 5px;">Country</label>
                <select id="country" name="country" required style=" width: 100%;
                                                                    padding: 10px;
                                                                    border: 1px solid #ccc;
                                                                    border-radius: 4px;
                                                                    box-sizing: border-box;">
                    <option value="">Select Country</option>
                    <option value="India">India</option>
                    <option value="Canada">Canada</option>
                    <option value="Austraila">Austraila</option>
                </select>
            </div>
            <div class="form-group" style=" margin-bottom: 15px;">
                <label for="state" style=" display: block;margin-bottom: 5px;">State</label>
                <select id="state" name="state" required style=" width: 100%;
                                                                padding: 10px;
                                                                border: 1px solid #ccc;
                                                                border-radius: 4px;
                                                                box-sizing: border-box;">
                    <option value="">Select State</option>
                </select>
            </div>
            <button type="submit" class="submit-btn" style="width: 100%;
                                                            padding: 10px;
                                                            background-color: #007bff;
                                                            border: none;
                                                            border-radius: 4px;
                                                            color: #fff;
                                                            font-size: 16px;
                                                            cursor: pointer;">
            Submit</button>
        </form>
    </div>

    <div class="table-container" style=" background-color: #fff;
                                        padding: 20px;
                                        border-radius: 8px;
                                        box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
                                        width: 95%;
                                        margin-bottom: 20px;">
        <h2 style=" text-align: center;margin-bottom: 20px;">User Data</h2>
        <table id="data-table" border="1" style="width: 100%;
                                                border-collapse: collapse;
                                                margin-top: 20px;
                                                border: 1px solid #ccc;">
            <thead>
                <tr>
                    <th style=" border: 1px solid #ccc; padding: 10px;text-align: left; background-color: #f2f2f2;">ID</th>
                    <th style=" border: 1px solid #ccc; padding: 10px;text-align: left;background-color: #f2f2f2;">Name</th>
                    <th style=" border: 1px solid #ccc; padding: 10px; text-align: left;background-color: #f2f2f2;">Email</th>
                    <th style=" border: 1px solid #ccc; padding: 10px;text-align: left;background-color: #f2f2f2;">Mobile</th>
                    <th style=" border: 1px solid #ccc; padding: 10px;text-align: left;background-color: #f2f2f2;">Country</th>
                    <th style=" border: 1px solid #ccc; padding: 10px;text-align: left;background-color: #f2f2f2;">State</th>
                    <th style=" border: 1px solid #ccc; padding: 10px;text-align: left;background-color: #f2f2f2;">Delete</th>
                </tr>
            </thead>
            <tbody id="fetch-data">

            </tbody>
        </table>
    </div>

    <script>
        var states = [
            { id: 1, name: 'Maharashtra', country_name: 'India' },
            { id: 2, name: 'Karnataka', country_name: 'India' },
            { id: 3, name: 'Tamil Nadu', country_name: 'India' },
            { id: 4, name: 'West Bengal', country_name: 'India' },
            { id: 5, name: 'Gujarat', country_name: 'India' },
            { id: 6, name: 'Ontario', country_name: 'Canada' },
            { id: 7, name: 'Quebec', country_name: 'Canada' },
            { id: 8, name: 'British Columbia', country_name: 'Canada' },
            { id: 9, name: 'Alberta', country_name: 'Canada' },
            { id: 10, name: 'Manitoba', country_name: 'Canada' },
            { id: 11, name: 'New South Wales', country_name: 'Austraila' },
            { id: 12, name: 'Victoria', country_name: 'Austraila' },
            { id: 13, name: 'Queensland', country_name: 'Austraila' },
            { id: 14, name: 'Western Australia', country_name: 'Austraila' },
            { id: 15, name: 'South Australia', country_name: 'Austraila' }
        ];


        document.getElementById('country').addEventListener('change', (event) => {
            const data = states.filter((value) => {
                if (value.country_name == event.target.value) {
                    return value;
                }
            })

            var stateOptions = '<option value="">Select State</option>';

            data.forEach((value) => {
                // stateOptions +='<option value="'+ value.name +'">'+ value.name +'</option>';
                stateOptions += `<option value="${value.name}">${value.name}</option>`;
            });

            document.getElementById('state').innerHTML = stateOptions;
        })

        var userData = [];

        function displayData() {
            if (userData.length > 0) {

                var userList = '';
                userData.forEach((value, index) => {
                    userList += `
            <tr>
                <td style=" border: 1px solid #ccc; padding: 10px;text-align: left;">${index + 1}</td>
                <td style=" border: 1px solid #ccc; padding: 10px;text-align: left;">${value.name}</td>
                <td style=" border: 1px solid #ccc; padding: 10px;text-align: left;">${value.email}</td>
                <td style=" border: 1px solid #ccc; padding: 10px;text-align: left;">${value.mobile_number}</td>
                <td style=" border: 1px solid #ccc; padding: 10px;text-align: left;">${value.country_name}</td>
                <td style=" border: 1px solid #ccc; padding: 10px;text-align: left;">${value.state_name}</td>
                <td style=" border: 1px solid #ccc; padding: 10px;text-align: left;"><button onclick="deleteUser(${index})">Delete</button></td>
            </tr>`;
                });

                document.getElementById('fetch-data').innerHTML = userList;
            } else {
                var noRecordFound = `
            <tr align="center" >
                <td align="center" colspan="7" style=" border: 1px solid #ccc; padding: 10px;text-align: left;">No Record Founds !!</td>
            </tr>
        `;

                document.getElementById('fetch-data').innerHTML = noRecordFound;
            }
        }

        displayData();

        document.getElementById('formHandler').addEventListener('submit', (e) => {
            e.preventDefault();

            const data = {
                name: e.target.name.value,
                email: e.target.email.value,
                mobile_number: e.target.mobile.value,
                country_name: e.target.country.value,
                state_name: e.target.state.value,
            }

            // userData = [...userData,data];     // Jis order m insert karooge us order m show hooga

            userData = [data, ...userData];     // reverse order m show hooga
            // userData.push(data);
            displayData();

            // e.target.name.value = '';
            // e.target.email.value = '';

            e.target.reset();

            var stateOptions = '<option value="">Select State</option>';
            document.getElementById('state').innerHTML = stateOptions;

            console.log(data);
        })

        function deleteUser(index) {
            if (confirm('Are you sure you want to delete ?')) {
                userData.splice(index, 1);
                displayData();
            }

        } 
    </script>
</body>

</html>
