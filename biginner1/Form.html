<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Basic Form Submission</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 500px;
            margin: 50px auto;
            padding: 20px;
            background-color: aqua;
        }

        label {
            font-weight: bold;
            display: block;
            margin-top: 10px;
        }

        input {
            width: 100%;
            padding: 8px;
            margin-top: 5px;
            box-sizing: border-box;
            border-style: solid;
            border-color: rgb(11, 80, 184);
        }

        button {
            background: #007bff;
            color: white;
            padding: 10px 20px;
            margin-top: 20px;
             margin-left: 200px;
            cursor: pointer;
           font-weight: bold;
        }

        .message {
            margin-top: 20px;
            padding: 10px;
            background: #f8f9fa;
            border-radius: 4px;
        }
    </style>
</head>

<body>
    <h1>HTML Structure and Basic server interaction</h1>
    <p>Objective:Introduced the concept of server-side rendering and basic form submission</p>
    <div class="form">
        <form action="/submit" method="POST">
            <label for="name">Name:</label>
            <input type="text" id="name" name="name" required>

            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required>

            <label for="message">Message:</label>
            <input type="text" id="message" name="message" required>

            <button type="submit">Submit</button>
        </form>

        <!-- Placeholder for server-rendered response -->
        <div id="response" class="message" style="display: none;"></div>

    </div>

</body>

</html>
